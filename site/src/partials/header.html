<a
  href="#main"
  class="sr-only rounded-md bg-ink px-3 py-2 text-white focus:not-sr-only focus:fixed focus:top-3 focus:left-3 focus:z-50"
  >Skip to content</a
>
<aside aria-label="Announcement" class="bg-ink text-sm text-white">
  <div class="mx-auto flex max-w-6xl items-center justify-center gap-2 px-6 py-2.5 text-center">
    <span class="shrink-0 rounded-full bg-teal-dark px-2 py-0.5 text-xs font-medium max-sm:hidden"
      >Early access</span
    >
    <a href="/#trial" class="group text-neutral-200 hover:text-white">
      Now taking trial requests: 14 days,&nbsp;free&nbsp;<span
        aria-hidden="true"
        class="inline-block transition-transform group-hover:translate-x-0.5"
        >&rarr;</span
      >
    </a>
  </div>
</aside>
<header
  data-header
  class="sticky top-0 z-40 border-b border-transparent bg-white/85 backdrop-blur-md"
>
  <div class="mx-auto flex h-16 max-w-6xl items-center gap-8 px-6">
    <a href="/" class="shrink-0">
      <img src="/logo.svg" alt="Changeport" width="140" height="19" class="h-[19px] w-[140px]" />
    </a>
    <nav aria-label="Site" class="hidden items-center gap-7 text-sm text-neutral-600 lg:flex">
      <a href="/#how" class="hover:text-ink">How it works</a>
      <a href="/#lag" class="hover:text-ink">Observability</a>
      <a href="/#tour" class="hover:text-ink">The console</a>
      <a href="/#trial" class="hover:text-ink">Trials</a>
      <a href="/#faq" class="hover:text-ink">Questions</a>
    </nav>
    <div class="ml-auto flex items-center gap-5 text-sm">
      <a href="%CONSOLE_URL%/" class="text-neutral-600 hover:text-ink max-sm:hidden">Sign in</a>
      <a
        href="%CONSOLE_URL%/trial"
        class="rounded-lg bg-ink px-3.5 py-2 font-medium text-white transition-colors hover:bg-ink-soft"
        >Start a trial</a
      >
      <details class="relative lg:hidden">
        <summary
          class="flex size-9 cursor-pointer list-none items-center justify-center rounded-lg border border-neutral-200 [&::-webkit-details-marker]:hidden"
        >
          <span class="sr-only">Menu</span>
          <svg aria-hidden="true" viewBox="0 0 20 20" class="size-4 fill-ink">
            <rect x="2" y="4" width="16" height="2" rx="1" />
            <rect x="2" y="9" width="16" height="2" rx="1" />
            <rect x="2" y="14" width="16" height="2" rx="1" />
          </svg>
        </summary>
        <nav
          aria-label="Site"
          class="absolute right-0 mt-2 flex w-56 flex-col rounded-xl border border-neutral-200 bg-white p-2 text-neutral-700 shadow-lg"
        >
          <a href="/#how" class="rounded-lg px-3 py-2 hover:bg-neutral-100">How it works</a>
          <a href="/#lag" class="rounded-lg px-3 py-2 hover:bg-neutral-100">Observability</a>
          <a href="/#tour" class="rounded-lg px-3 py-2 hover:bg-neutral-100">The console</a>
          <a href="/#trial" class="rounded-lg px-3 py-2 hover:bg-neutral-100">Trials</a>
          <a href="/#faq" class="rounded-lg px-3 py-2 hover:bg-neutral-100">Questions</a>
          <a href="%CONSOLE_URL%/" class="rounded-lg px-3 py-2 hover:bg-neutral-100">Sign in</a>
        </nav>
      </details>
    </div>
  </div>
</header>

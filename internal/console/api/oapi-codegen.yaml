# oapi-codegen writes api.gen.go from api/openapi.yaml: the types, and a
# strict server on net/http that internal/console implements.
package: api
output: internal/console/api/api.gen.go
generate:
  models: true
  std-http-server: true
  strict-server: true
  embedded-spec: false
output-options:
  # The schemas of server-sent events, such as TailMessage, are no request's
  # or response's body, which pruning would drop.
  skip-prune: true

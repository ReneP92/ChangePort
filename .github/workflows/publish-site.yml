# Publishes the landing site (site/) at the domain's root on every push to
# main, once the site's own checks pass (just site-check, as CI's site job
# runs them): builds it for the domain, with the console at console.<domain>,
# and syncs it into its bucket behind CloudFront (terraform/modules/static-site,
# hack/publish-site.sh). It does not wait for the rest of CI, whose
# end-to-end suites on kind take half an hour and cannot change the site,
# though a merge whose other checks fail goes live all the same (docs/site.md,
# Publishing). It publishes on every push, as uploading the few dozen files
# costs next to nothing, and a push whose run is superseded while it waits is
# published by the newer one, which a check of what one commit changed would
# miss.
#
# It needs, once prod is applied, the repository variables
# SITE_DOMAIN, SITE_BUCKET, SITE_DISTRIBUTION_ID and SITE_PUBLISH_ROLE_ARN,
# from the site_publishing output of terraform/environments/prod
# (terraform/README.md); until they are set, nothing runs.
name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

# One publish at a time, each to completion.
concurrency:
  group: publish-site
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Checks the site and builds it for the domain, without the publish role:
  # the tests run third-party tools and a browser, which never get the token
  # that assumes it.
  build:
    name: Check and build the landing site
    if: vars.SITE_PUBLISH_ROLE_ARN != ''
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-just
      # The pinned tools in bin/ and Playwright's browser, as CI's site job
      # caches them.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            bin/
            !bin/*.kubeconfig
            ~/.cache/ms-playwright
          key: site-tools-${{ runner.os }}-${{ hashFiles('hack/lib.sh', 'site/bun.lock') }}
      # The site's tests and Lighthouse, on the commit it publishes.
      - run: just site-check
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: site-reports
          path: |
            site/lighthouse
            site/playwright-report
            site/test-results
          retention-days: 14
      - name: Build for the domain
        env:
          CHANGEPORT_SITE_URL: https://${{ vars.SITE_DOMAIN }}
          CHANGEPORT_CONSOLE_URL: https://console.${{ vars.SITE_DOMAIN }}
        run: just site-build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: site
          path: site/dist
          retention-days: 1

  # Publishes what the build job built; the publish role only trusts runs on
  # main. A run that waited behind another, or a job re-run for an older
  # commit, would put that commit's site back, so it publishes only while
  # its commit is main's newest, which it checks right before.
  publish:
    name: Publish the landing site
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: site
          path: site/dist
      - id: newest
        name: Main's newest commit
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          main=$(gh api "repos/$REPOSITORY/commits/main" --jq .sha)
          if [[ $main == "$COMMIT" ]]; then
            echo "newest=true" >>"$GITHUB_OUTPUT"
          else
            echo "::notice::$COMMIT is no longer main's newest commit ($main), whose run publishes it"
          fi
      - if: steps.newest.outputs.newest == 'true'
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.SITE_PUBLISH_ROLE_ARN }}
          aws-region: us-east-1
      - name: Publish
        if: steps.newest.outputs.newest == 'true'
        env:
          SITE_BUCKET: ${{ vars.SITE_BUCKET }}
          SITE_DISTRIBUTION_ID: ${{ vars.SITE_DISTRIBUTION_ID }}
        run: hack/publish-site.sh site/dist "$SITE_BUCKET" "$SITE_DISTRIBUTION_ID"

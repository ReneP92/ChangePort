# Publishes the landing site (site/) at the domain's root on every push to
# main, once the site's own checks pass (just site-check, as CI's site job
# runs them): builds it for the domain, with the console at console.<domain>,
# and syncs it into its bucket behind CloudFront (terraform/modules/static-site,
# hack/publish-site.sh). It does not wait for the rest of CI, whose
# end-to-end suites on kind take half an hour and cannot change the site. It
# publishes on every push, as uploading the few dozen files costs next to
# nothing, and a push whose run is superseded while it waits is published by
# the newer one, which a check of what one commit changed would miss.
#
# It needs, once prod has a domain (#8), the repository variables
# SITE_DOMAIN, SITE_BUCKET, SITE_DISTRIBUTION_ID and SITE_PUBLISH_ROLE_ARN,
# from the site_publishing output of terraform/environments/prod
# (terraform/README.md); until they are set, nothing runs.
name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

# One publish at a time, each to completion.
concurrency:
  group: publish-site
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # On a push to main, or by hand; the publish role only trusts runs on
  # main. A run that waited behind another, or one re-run for an older
  # commit, would put that commit's site back, so only main's newest commit
  # is published.
  newest:
    name: Main's newest commit
    if: vars.SITE_PUBLISH_ROLE_ARN != ''
    runs-on: ubuntu-26.04
    outputs:
      commit: ${{ steps.newest.outputs.commit }}
    steps:
      - id: newest
        env:
          GH_TOKEN: ${{ github.token }}
          COMMIT: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        run: |
          main=$(gh api "repos/$REPOSITORY/commits/main" --jq .sha)
          if [[ $main == "$COMMIT" ]]; then
            echo "commit=$COMMIT" >>"$GITHUB_OUTPUT"
          else
            echo "::notice::$COMMIT is no longer main's newest commit ($main), whose run publishes it"
          fi

  publish:
    name: Publish the landing site
    needs: newest
    if: needs.newest.outputs.commit != ''
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.newest.outputs.commit }}
      - uses: ./.github/actions/setup-just
      # The pinned tools in bin/ and Playwright's browser, as CI's site job
      # caches them.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            bin/
            !bin/*.kubeconfig
            ~/.cache/ms-playwright
          key: site-tools-${{ runner.os }}-${{ hashFiles('hack/lib.sh', 'site/bun.lock') }}
      # The site's tests and Lighthouse, on the commit it publishes.
      - run: just site-check
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: site-reports
          path: |
            site/lighthouse
            site/playwright-report
            site/test-results
          retention-days: 14
      - name: Build
        env:
          CHANGEPORT_SITE_URL: https://${{ vars.SITE_DOMAIN }}
          CHANGEPORT_CONSOLE_URL: https://console.${{ vars.SITE_DOMAIN }}
        run: just site-build
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.SITE_PUBLISH_ROLE_ARN }}
          aws-region: us-east-1
      - name: Publish
        env:
          SITE_BUCKET: ${{ vars.SITE_BUCKET }}
          SITE_DISTRIBUTION_ID: ${{ vars.SITE_DISTRIBUTION_ID }}
        run: hack/publish-site.sh site/dist "$SITE_BUCKET" "$SITE_DISTRIBUTION_ID"

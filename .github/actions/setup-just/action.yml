name: Set up just
description: >-
  Puts the pinned just on the PATH: from GitHub Actions' cache, or else from
  its GitHub release, checksum-verified and with retries, as the release
  downloads answer 5xx now and then.
runs:
  using: composite
  steps:
    - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.cache/just
        key: just-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('.github/actions/setup-just/action.yml') }}
    - shell: bash
      env:
        JUST_VERSION: 1.59.0
        # From the release's SHA256SUMS.
        JUST_SHA256: 409044617b6f06517c1035e55ca38c8c856ff8b650e41bc2aa1ef82d5903a23e
      run: |
        set -euo pipefail
        [[ $RUNNER_OS/$RUNNER_ARCH == Linux/X64 ]] || { echo "::error::no pinned just for $RUNNER_OS/$RUNNER_ARCH"; exit 1; }
        dir=~/.cache/just/$JUST_VERSION
        if [[ ! -x $dir/just ]]; then
          archive=$RUNNER_TEMP/just.tar.gz
          curl -fsSL --retry 7 --retry-all-errors --connect-timeout 30 --speed-limit 1024 --speed-time 60 -o "$archive" \
            "https://github.com/casey/just/releases/download/$JUST_VERSION/just-$JUST_VERSION-x86_64-unknown-linux-musl.tar.gz"
          echo "$JUST_SHA256  $archive" | sha256sum --check --quiet
          mkdir -p "$dir"
          tar -xzf "$archive" -C "$dir" just
          rm "$archive"
        fi
        echo "$dir" >>"$GITHUB_PATH"
        "$dir/just" --version

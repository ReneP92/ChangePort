# Where the operators' alerts go on kind: to the alert receiver of
# alert-receiver.yaml, by receiver, with resolved alerts too, and soon, so
# that tests see them. Otherwise as in deploy/base/alerting, which the
# provisioner adds customers' routes to.
route:
  receiver: none
  group_by: [alertname, tenant, cluster, source]
  group_wait: 10s
  group_interval: 30s
  repeat_interval: 4h
  routes:
    - matchers: ['alertname="Watchdog"']
      receiver: watchdog
      group_wait: 0s
      group_interval: 1m
      repeat_interval: 1m
    - matchers: ['audience="operator"', 'severity="page"']
      receiver: page
    - matchers: ['audience="operator"', 'severity="warn"']
      receiver: warn
inhibit_rules:
  - source_matchers: ['severity="page"']
    target_matchers: ['alertname=~"KafkaUnderReplicatedPartitions|ScrapeTargetDown"']
    equal: [tenant, cluster]
receivers:
  - name: none
  - name: page
    webhook_configs:
      - url: http://alert-receiver:8080/page
        send_resolved: true
  - name: warn
    webhook_configs:
      - url: http://alert-receiver:8080/warn
        send_resolved: true
  - name: watchdog
    webhook_configs:
      - url: http://alert-receiver:8080/watchdog
        send_resolved: false

# Platform components of the local kind cluster. Applied first by
# hack/platform-apply.sh; config/ follows once the operators are ready.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
  - ../../base/strimzi
  - ../../base/cert-manager
  - ../../base/provisioner
  - ../../base/console
  - ../../base/object-store
  - ../../base/victoria-metrics
  - ../../base/alerting
  - alert-receiver.yaml
# Alerts go to the alert receiver rather than PagerDuty and Slack.
configMapGenerator:
  - name: alertmanager-config
    namespace: metrics
    behavior: replace
    files:
      - alertmanager.yaml
    options:
      disableNameSuffixHash: true
patches:
  # The console at http://localhost:8088: a NodePort that deploy/kind maps to
  # that port on the host, and the origins tokens may come from, including
  # the Vite dev server of just web-dev.
  - target:
      kind: Deployment
      name: changeport-console
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/env/0/value
        value: http://localhost:8088,http://localhost:5173
      # The Postgres that stands in for customers' databases is on the
      # cluster's own network (deploy/base/source-postgres).
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: -allow-private-databases
      # So is the webhook that stands in for customers' alert receivers.
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: -allow-private-receivers
  - target:
      kind: Service
      name: changeport-console
    patch: |-
      - op: add
        path: /spec/type
        value: NodePort
      - op: add
        path: /spec/ports/0/nodePort
        value: 30088
  # The platform the provisioner provisions customers on.
  - target:
      kind: Deployment
      name: changeport-provisioner
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/args/-
        value: -platform=kind
  # The metrics and alerting pipeline and the provisioner run on the
  # control-plane node, apart from the workers that customers' brokers run
  # on, as platform components do apart from customers' dedicated nodes in
  # production: a test that freezes a worker never freezes alerting. Their
  # storage is the pod's own, as a volume would tie them to one node.
  - target:
      kind: Deployment
      name: (victoria-metrics|vmalert|alertmanager|alert-receiver|changeport-provisioner)
    patch: |-
      - op: add
        path: /spec/template/spec/nodeSelector
        value: {node-role.kubernetes.io/control-plane: ""}
      - op: add
        path: /spec/template/spec/tolerations
        value: [{key: node-role.kubernetes.io/control-plane, operator: Exists, effect: NoSchedule}]
  # Alertmanager reaches the alert receiver, on the cluster's own network.
  - target:
      kind: NetworkPolicy
      name: alertmanager-egress
    patch: |-
      - op: add
        path: /spec/egress/-
        value:
          to:
            - podSelector: {matchLabels: {app.kubernetes.io/name: alert-receiver}}
          ports:
            - {protocol: TCP, port: 8080}
  - target:
      kind: Deployment
      name: victoria-metrics
    patch: |-
      - op: replace
        path: /spec/template/spec/volumes/0
        value: {name: storage, emptyDir: {}}
  - target:
      kind: Deployment
      name: alertmanager
    patch: |-
      - op: replace
        path: /spec/template/spec/volumes/0
        value: {name: data, emptyDir: {}}
  - target:
      kind: PersistentVolumeClaim
      name: (victoria-metrics-data|alertmanager-data)
    patch: |-
      $patch: delete
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: ignored


# Alerting rules for customers' Postgres CDC sources (docs/cdc.md), which
# vmalert evaluates with the other rules here. Each alert carries tenant,
# cluster, env and source, says who it is for (audience: operator, which
# Alertmanager pages or warns, or customer, which the console shows and the
# customer's own receivers get) and how urgent (severity: page or warn), and
# links its section of docs/runbook.md, or for the customer's alerts, of the
# customer docs (site/content/docs/alerts.md, by the annotation docs, which
# their notifications link). The customer's alerts compare with the
# customer's thresholds, changeport_alert_threshold, as those of
# customers.yaml do (docs/alerts.md); one the customer turned off has no
# threshold, and never fires. The operators' are fixed. internal/alerts
# checks them, and the end-to-end tests evaluate them on kind.
groups:
  - name: postgres-sources
    rules:
      # The database invalidated the slot: changes are lost until the source
      # gets a new slot and copies its tables again.
      - alert: PostgresSourceSlotLost
        expr: changeport_source_slot_lost == 1
        labels:
          severity: page
          audience: operator
        annotations:
          summary: "Postgres source {{ $labels.source }} of {{ $labels.tenant }} lost its replication slot"
          description: "The database invalidated the slot, as it held back more WAL than max_slot_wal_keep_size allows. Changes since then are missing until the source has a new slot and has copied its tables again."
          runbook: https://github.com/ReneP92/changeport/blob/main/docs/runbook.md#a-lost-replication-slot
      # The slot is close to max_slot_wal_keep_size: the database will
      # invalidate it soon unless the source catches up.
      - alert: PostgresSourceSlotNearLimit
        expr: >-
          changeport_source_slot_safe_wal_bytes
          / (changeport_source_slot_safe_wal_bytes + changeport_source_retained_wal_bytes) < 0.2
        for: 10m
        labels:
          severity: page
          audience: operator
        annotations:
          summary: "Postgres source {{ $labels.source }} of {{ $labels.tenant }} holds back WAL close to the database's limit"
          description: "The slot keeps more than 80% of the WAL max_slot_wal_keep_size allows. If the source does not catch up, the database invalidates the slot."
          runbook: https://github.com/ReneP92/changeport/blob/main/docs/runbook.md#a-postgres-source-fails
      # The slot keeps more WAL than the customer allows, in a database
      # without max_slot_wal_keep_size, whose disk it fills with nothing to
      # stop it; with a limit, PostgresSourceSlotFilling measures against it.
      - alert: PostgresSourceRetainedWALHigh
        expr: >-
          changeport_source_retained_wal_bytes
          > on (tenant) group_left ()
          max by (tenant) (changeport_alert_threshold{alert="PostgresSourceRetainedWALHigh"})
          unless on (tenant, source) changeport_source_slot_safe_wal_bytes
        for: 30m
        labels:
          severity: warn
          audience: customer
        annotations:
          summary: "Postgres source {{ $labels.source }} holds back {{ $value | humanize }}B of WAL"
          description: "The database keeps the WAL the source has not read, on its disk, more than your threshold. A paused, failed or slow source makes it grow."
          docs: alerts.html#a-source-holds-back-a-lot-of-history
      # The slot keeps a larger share of the WAL max_slot_wal_keep_size
      # allows than the customer allows, before the operators' page at 80%.
      - alert: PostgresSourceSlotFilling
        expr: >-
          changeport_source_retained_wal_bytes
          / (changeport_source_slot_safe_wal_bytes + changeport_source_retained_wal_bytes)
          > on (tenant) group_left ()
          max by (tenant) (changeport_alert_threshold{alert="PostgresSourceSlotFilling"})
        for: 10m
        labels:
          severity: warn
          audience: customer
        annotations:
          summary: "Postgres source {{ $labels.source }} holds back {{ $value | humanizePercentage }} of the WAL its database allows"
          description: "The slot keeps more of the WAL max_slot_wal_keep_size allows than your threshold. Past the limit, the database invalidates the slot, and the source must copy its tables again."
          docs: alerts.html#a-sources-slot-is-filling-up
      # The source failed, and stays failed: its connector stopped on an
      # error its status explains, and its slot keeps WAL meanwhile.
      - alert: PostgresSourceFailed
        expr: changeport_source_phase{phase="Failed"} == 1
        for: 10m
        labels:
          severity: page
          audience: operator
        annotations:
          summary: "Postgres source {{ $labels.source }} of {{ $labels.tenant }} failed"
          description: "The source's connector stopped on an error. Its status says why; its slot keeps WAL until it runs again."
          runbook: https://github.com/ReneP92/changeport/blob/main/docs/runbook.md#a-postgres-source-fails
      # Connect's own view, should the source controller not be reporting.
      - alert: PostgresSourceTaskFailed
        expr: max by (tenant, cluster, env, source) (kafka_connect_task_status{status="failed"}) == 1
        for: 15m
        labels:
          severity: warn
          audience: operator
        annotations:
          summary: "The connector task of Postgres source {{ $labels.source }} of {{ $labels.tenant }} failed"
          description: "Kafka Connect reports the source's task as failed, and Strimzi's restarts have not brought it back."
          runbook: https://github.com/ReneP92/changeport/blob/main/docs/runbook.md#a-postgres-source-fails
      # The source runs, but the changes it writes happened longer ago than
      # the customer allows.
      - alert: PostgresSourceBehind
        expr: >-
          debezium_streaming_millisecondsbehindsource / 1000
          > on (tenant) group_left ()
          max by (tenant) (changeport_alert_threshold{alert="PostgresSourceBehind"})
        for: 5m
        labels:
          severity: warn
          audience: customer
        annotations:
          summary: "Postgres source {{ $labels.source }} is {{ $value | humanizeDuration }} behind its database"
          description: "The changes the source writes to Kafka happened longer ago in the database than your threshold."
          docs: alerts.html#a-source-is-behind-its-database
      # A source an hour behind, whatever the customer allows: its connector
      # cannot keep up, before its slot nears the limit.
      - alert: PostgresSourceConnectorBehind
        expr: debezium_streaming_millisecondsbehindsource > 60 * 60 * 1000
        for: 15m
        labels:
          severity: warn
          audience: operator
        annotations:
          summary: "Postgres source {{ $labels.source }} of {{ $labels.tenant }} is more than an hour behind its database"
          description: "The changes the source's connector writes to Kafka happened more than an hour ago in the database: it reads the WAL more slowly than the database writes it."
          runbook: https://github.com/ReneP92/changeport/blob/main/docs/runbook.md#a-postgres-source-falls-behind
      # A streaming source writes no heartbeat, which it writes every minute
      # to its heartbeat topic, while its slot keeps more and more WAL: its
      # connector stopped reading without failing, which neither Connect's
      # status nor Debezium's own metrics, which go with its task, show.
      # Connect's count of written records does not tell either, as each
      # retry writes a notification. The slot's readings come from the
      # database, through the source controller, so they go on. A source
      # copies its tables while changes stream, so a snapshotting source
      # writes heartbeats too. Only while the customer's brokers are
      # scraped: without their metrics, every source would look stalled. No
      # heartbeat in 5 minutes, and more WAL than at any time in the last
      # 15, which a database written to now and then gives, as a stalled
      # slot's only grows; held for 30.
      - alert: PostgresSourceStalled
        expr: &stalled >-
          changeport_source_retained_wal_bytes > min_over_time(changeport_source_retained_wal_bytes[15m])
          and on (tenant, source) (changeport_source_phase{phase=~"Snapshotting|Streaming"} == 1)
          and on (tenant) (max by (tenant) (up{job="kafka"}) == 1)
          unless on (tenant, source) (
            label_replace(
              sum by (tenant, topic) (increase(kafka_server_brokertopicmetrics_messagesinpersec_total{topic=~"changeport[.]cdc[.]heartbeat[.].+"}[5m])),
              "source", "$1", "topic", "changeport[.]cdc[.]heartbeat[.](.+)"
            ) > 0
          )
        for: 30m
        labels:
          severity: warn
          audience: customer
        annotations:
          summary: "Postgres source {{ $labels.source }} has stopped reading its database"
          description: "For 30 minutes the source has written nothing to Kafka while its slot keeps more and more WAL. Changes wait in the database until it reads again."
          docs: alerts.html#a-source-has-stopped-reading-its-database
      - alert: PostgresSourceConnectorStalled
        expr: *stalled
        for: 30m
        labels:
          severity: warn
          audience: operator
        annotations:
          summary: "The connector of Postgres source {{ $labels.source }} of {{ $labels.tenant }} has stopped reading"
          description: "For 30 minutes the source has written nothing to Kafka, not even heartbeats, while its slot keeps more and more WAL, and Connect reports nothing wrong."
          runbook: https://github.com/ReneP92/changeport/blob/main/docs/runbook.md#a-postgres-source-stalls
      # The source controller could not read the slot for a while: the
      # database does not answer it, and nobody sees the WAL grow.
      - alert: PostgresSourceDatabaseUnreachable
        expr: time() - changeport_source_slot_checked_timestamp_seconds > 15 * 60
        labels:
          severity: warn
          audience: customer
        annotations:
          summary: "Changeport cannot reach the database of Postgres source {{ $labels.source }}"
          description: "The source controller has not read the source's slot for more than 15 minutes."
          docs: alerts.html#changeport-cant-reach-a-sources-database
      # A deleted source waits for its slot to be dropped, which keeps WAL
      # in the customer's database until it is.
      - alert: PostgresSourceSlotNotDropped
        expr: changeport_source_phase{phase="Deleting"} == 1
        for: 30m
        labels:
          severity: warn
          audience: operator
        annotations:
          summary: "The replication slot of deleted Postgres source {{ $labels.source }} of {{ $labels.tenant }} is not dropped"
          description: "The source was deleted 30 minutes ago or more, and its slot still keeps WAL in the customer's database."
          runbook: https://github.com/ReneP92/changeport/blob/main/docs/runbook.md#a-replication-slot-left-behind
      # A source paused for a day keeps a day of WAL.
      - alert: PostgresSourcePausedLong
        expr: changeport_source_phase{phase="Stopped"} == 1
        for: 24h
        labels:
          severity: warn
          audience: customer
        annotations:
          summary: "Postgres source {{ $labels.source }} has been paused for a day"
          description: "A paused source keeps its slot, which keeps every change since it paused in the database's WAL."
          docs: alerts.html#a-source-has-been-paused-for-a-day

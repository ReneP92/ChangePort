# Where the operators' alerts go, in the EKS environments. Pages, for what
# hurts customers now, go to PagerDuty and to Slack; warnings, to act on
# within hours, go to Slack; the Watchdog, which always fires, goes to a dead
# man's switch, which raises its own alarm once it stops hearing from it. The
# secrets are files of the Secret alertmanager-receivers (just
# alerting-config). The provisioner adds a route before these for each
# customer that has receivers, for the alerts meant for customers
# (docs/alerts.md); the others' go nowhere but the console. The timeline's
# alerts go to the provisioner (docs/timeline.md).
global:
  resolve_timeout: 5m
route:
  receiver: none
  group_by: [alertname, tenant, cluster, source]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    # The timeline's alerts mark when something started and stopped, such as
    # a client being throttled; they go only to the provisioner, which
    # records them (docs/timeline.md). Their times come from the alerts, so
    # they need not go out soon.
    - matchers: ['audience="timeline"']
      receiver: timeline
      group_by: [alertname, tenant, client_id]
      repeat_interval: 1h
    - matchers: ['alertname="Watchdog"']
      receiver: watchdog
      group_wait: 0s
      group_interval: 1m
      repeat_interval: 1m
    - matchers: ['audience="operator"', 'severity="page"']
      receiver: pagerduty
      continue: true
    - matchers: ['audience="operator"', 'severity=~"page|warn"']
      receiver: slack
# A page about a cluster silences the warnings it explains: partitions out of
# sync and a scrape target down while a broker is.
inhibit_rules:
  - source_matchers: ['severity="page"']
    target_matchers: ['alertname=~"KafkaUnderReplicatedPartitions|ScrapeTargetDown"']
    equal: [tenant, cluster]
receivers:
  - name: none
  - name: timeline
    webhook_configs:
      - url: http://changeport-provisioner.changeport.svc:8082/alertmanager
        send_resolved: true
  - name: pagerduty
    pagerduty_configs:
      - routing_key_file: /etc/alertmanager/receivers/pagerduty-routing-key
        send_resolved: true
        description: '{{ .CommonAnnotations.summary }}'
        links:
          - href: '{{ .CommonAnnotations.runbook }}'
            text: Runbook
  - name: slack
    slack_configs:
      - api_url_file: /etc/alertmanager/receivers/slack-api-url
        send_resolved: true
        title: '{{ if eq .Status "firing" }}{{ .CommonLabels.severity | toUpper }}{{ else }}RESOLVED{{ end }}: {{ .CommonAnnotations.summary }}'
        text: '{{ .CommonAnnotations.description }}{{ if .CommonAnnotations.runbook }} <{{ .CommonAnnotations.runbook }}|Runbook>{{ end }} ({{ .CommonLabels.env }})'
  - name: watchdog
    webhook_configs:
      - url_file: /etc/alertmanager/receivers/watchdog-url
        send_resolved: false

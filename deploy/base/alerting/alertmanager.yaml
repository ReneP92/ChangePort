# Where alerts go, in the EKS environments. Pages, for what hurts customers
# now, go to PagerDuty and to Slack; warnings, to act on within hours, go to
# Slack; the Watchdog, which always fires, goes to a dead man's switch, which
# raises its own alarm once it stops hearing from it. The secrets are files
# of the Secret alertmanager-receivers (just alerting-config).
global:
  resolve_timeout: 5m
route:
  receiver: slack
  group_by: [alertname, tenant, cluster, source]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  routes:
    - matchers: ['alertname="Watchdog"']
      receiver: watchdog
      group_wait: 0s
      group_interval: 1m
      repeat_interval: 1m
    - matchers: ['severity="page"']
      receiver: pagerduty
      continue: true
    - matchers: ['severity=~"page|warn"']
      receiver: slack
# A page about a cluster silences the warnings it explains: partitions out of
# sync and a scrape target down while a broker is.
inhibit_rules:
  - source_matchers: ['severity="page"']
    target_matchers: ['alertname=~"KafkaUnderReplicatedPartitions|ScrapeTargetDown"']
    equal: [tenant, cluster]
receivers:
  - name: pagerduty
    pagerduty_configs:
      - routing_key_file: /etc/alertmanager/receivers/pagerduty-routing-key
        send_resolved: true
        description: '{{ .CommonAnnotations.summary }}'
        links:
          - href: '{{ .CommonAnnotations.runbook }}'
            text: Runbook
  - name: slack
    slack_configs:
      - api_url_file: /etc/alertmanager/receivers/slack-api-url
        send_resolved: true
        title: '{{ if eq .Status "firing" }}{{ .CommonLabels.severity | toUpper }}{{ else }}RESOLVED{{ end }}: {{ .CommonAnnotations.summary }}'
        text: '{{ .CommonAnnotations.description }}{{ if .CommonAnnotations.runbook }} <{{ .CommonAnnotations.runbook }}|Runbook>{{ end }} ({{ .CommonLabels.env }})'
  - name: watchdog
    webhook_configs:
      - url_file: /etc/alertmanager/receivers/watchdog-url
        send_resolved: false

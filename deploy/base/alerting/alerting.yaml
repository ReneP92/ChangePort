# vmalert evaluates the alerting rules every 30 seconds against
# VictoriaMetrics, writes their state back to it so that a restart resumes
# pending alerts, and sends what fires to Alertmanager. CHANGEPORT_ENV, which
# the overlays set as for VictoriaMetrics, labels every alert, also those
# without series of their own, such as Watchdog.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vmalert
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vmalert
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vmalert
    spec:
      containers:
        - name: vmalert
          image: victoriametrics/vmalert:v1.154.1
          args:
            - -rule=/rules/*.yaml
            - -datasource.url=http://victoria-metrics:8428
            - -remoteWrite.url=http://victoria-metrics:8428
            - -remoteRead.url=http://victoria-metrics:8428
            - -notifier.url=http://alertmanager:9093
            - -evaluationInterval=30s
            - -external.label=env=%{CHANGEPORT_ENV}
          env:
            - name: CHANGEPORT_ENV
              value: kind
          ports:
            - name: http
              containerPort: 8880
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          volumeMounts:
            - name: rules
              mountPath: /rules
              readOnly: true
      volumes:
        - name: rules
          configMap:
            name: vmalert-rules
---
apiVersion: v1
kind: Service
metadata:
  name: vmalert
spec:
  selector:
    app.kubernetes.io/name: vmalert
  ports:
    - name: http
      port: 8880
      targetPort: http
---
# Alertmanager keeps its silences and what it has notified on its volume.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: alertmanager-data
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: alertmanager
spec:
  replicas: 1
  # One pod at a time owns the data volume.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: alertmanager
  template:
    metadata:
      labels:
        app.kubernetes.io/name: alertmanager
    spec:
      securityContext:
        fsGroup: 65534
      # Alertmanager runs the configuration the provisioner writes, with the
      # customers' routes (Secret alertmanager-generated), or the base until
      # it has (ConfigMap alertmanager-config). The init container picks the
      # first, and the config-reloader keeps it current and reloads
      # Alertmanager when it changes.
      initContainers:
        - name: config
          image: quay.io/prometheus/alertmanager:v0.34.2
          command: [sh, -c, '. /scripts/pick.sh && cp "$(pick)" /active/alertmanager.yaml']
          volumeMounts: &config-mounts
            - name: scripts
              mountPath: /scripts
              readOnly: true
            - name: config
              mountPath: /config/base
              readOnly: true
            - name: generated
              mountPath: /config/generated
              readOnly: true
            - name: active
              mountPath: /active
      containers:
        - name: alertmanager
          image: quay.io/prometheus/alertmanager:v0.34.2
          args:
            - --config.file=/active/alertmanager.yaml
            - --storage.path=/alertmanager
            # A single instance, not a cluster.
            - --cluster.listen-address=
          ports:
            - name: http
              containerPort: 9093
          readinessProbe:
            httpGet:
              path: /-/ready
              port: http
            periodSeconds: 5
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 128Mi
          volumeMounts:
            - name: data
              mountPath: /alertmanager
            - name: active
              mountPath: /active
              readOnly: true
            - name: receivers
              mountPath: /etc/alertmanager/receivers
              readOnly: true
        - name: config-reloader
          image: quay.io/prometheus/alertmanager:v0.34.2
          command: [sh, /scripts/reload.sh]
          resources:
            requests:
              cpu: 5m
              memory: 8Mi
            limits:
              memory: 32Mi
          volumeMounts: *config-mounts
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: alertmanager-data
        - name: scripts
          configMap:
            name: alertmanager-scripts
        - name: config
          configMap:
            name: alertmanager-config
        - name: generated
          secret:
            secretName: alertmanager-generated
            optional: true
        - name: active
          emptyDir: {}
        # The receivers' secrets, written by just alerting-config; absent
        # where the overlay routes elsewhere.
        - name: receivers
          secret:
            secretName: alertmanager-receivers
            optional: true
---
apiVersion: v1
kind: Service
metadata:
  name: alertmanager
spec:
  selector:
    app.kubernetes.io/name: alertmanager
  ports:
    - name: http
      port: 9093
      targetPort: http
---
# Alertmanager sends customers' alerts to the receivers they choose
# (docs/alerts.md), so it reaches only DNS and the internet: never the
# cluster's own networks or the cloud's metadata service, whatever a
# customer's webhook points at. The ranges are those the console refuses for
# webhooks (cdc.Public), as the Connect worker's are.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: alertmanager-egress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: alertmanager
  policyTypes: [Egress]
  egress:
    - ports:
        - {protocol: UDP, port: 53}
        - {protocol: TCP, port: 53}
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except:
              - 0.0.0.0/8
              - 10.0.0.0/8
              - 100.64.0.0/10
              - 127.0.0.0/8
              - 169.254.0.0/16
              - 172.16.0.0/12
              - 192.0.0.0/24
              - 192.0.2.0/24
              - 192.168.0.0/16
              - 198.18.0.0/15
              - 198.51.100.0/24
              - 203.0.113.0/24
              - 224.0.0.0/3

# VictoriaLogs single-node, the store of the change timeline's events
# (docs/timeline.md), next to the metrics store in the metrics namespace, and
# kept as long: 30 days. The volume uses the cluster's default storage
# class.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: metrics
labels:
  - pairs:
      changeport.io/platform: victoria-logs
resources:
  - victoria-logs.yaml

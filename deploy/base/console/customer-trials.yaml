# The console may patch Customers (deploy/base/console/console.yaml) only for
# what its users may change: an operator extends a trial or converts a
# customer, and an organization's admins rename an environment, choose the
# default one and turn its deletion protection on or off (docs/console.md).
# It can never move, resize or rename a customer, put one on a trial, or
# touch its metadata, such as the finalizer that deprovisions its cluster. A
# new field of CustomerSpec belongs in the comparison below, unless the
# console may change it.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: changeport-console-customers
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [changeport.io]
        apiVersions: ["*"]
        operations: [UPDATE]
        resources: [customers]
  matchConditions:
    - name: the-console
      expression: request.userInfo.username == 'system:serviceaccount:changeport:changeport-console'
  validations:
    - expression: has(oldObject.spec.trial) || !has(object.spec.trial)
      message: the console may only change the trial of a customer on a trial
      reason: Forbidden
    - expression: >-
        object.spec.displayName == oldObject.spec.displayName &&
        object.spec.profile == oldObject.spec.profile &&
        object.spec.?clerkOrganizationID == oldObject.spec.?clerkOrganizationID
      message: the console may change only a customer's trial, environment, default environment and deletion protection
      reason: Forbidden
    - expression: >-
        object.metadata.?labels == oldObject.metadata.?labels &&
        object.metadata.?annotations == oldObject.metadata.?annotations &&
        object.metadata.?finalizers == oldObject.metadata.?finalizers &&
        object.metadata.?ownerReferences == oldObject.metadata.?ownerReferences
      message: the console may not change a customer's metadata
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: changeport-console-customers
spec:
  policyName: changeport-console-customers
  validationActions: [Deny]

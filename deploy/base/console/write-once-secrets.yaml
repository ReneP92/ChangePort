# The console may create Secrets (deploy/base/console/console.yaml), as RBAC
# cannot scope creating by name; this policy narrows that to two kinds of
# write-once Secrets in a customer's namespace, each of its own type and
# name, immutable, and holding only its one key:
#
# - the password Secrets of customers' Postgres CDC sources (docs/cdc.md),
#   which the source controller moves on and deletes;
# - the secrets of customers' alert receivers (docs/alerts.md), which only
#   the provisioner reads.
#
# The console can never read, change or delete them, nor any other Secret.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: changeport-console-secrets
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: [v1]
        operations: [CREATE, UPDATE, DELETE]
        resources: [secrets]
  matchConditions:
    - name: the-console
      expression: request.userInfo.username == 'system:serviceaccount:changeport:changeport-console'
  validations:
    - expression: request.operation == 'CREATE'
      message: the console may only create Secrets
      reason: Forbidden
    - expression: >-
        request.operation != 'CREATE' || (
        request.namespace.startsWith('customer-') &&
        has(object.immutable) && object.immutable &&
        has(object.data) && object.data.size() == 1 && (
        (object.metadata.name.startsWith('postgres-password-') &&
        object.type == 'changeport.io/postgres-password' && 'password' in object.data) ||
        (object.metadata.name.startsWith('alert-receiver-') &&
        object.type == 'changeport.io/alert-receiver' && 'value' in object.data)))
      message: >-
        the console may only create a Postgres source's password Secret (named postgres-password-,
        of type changeport.io/postgres-password, holding only the password) or an alert receiver's
        Secret (named alert-receiver-, of type changeport.io/alert-receiver, holding only the value),
        immutable, in a customer's namespace
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: changeport-console-secrets
spec:
  policyName: changeport-console-secrets
  validationActions: [Deny]

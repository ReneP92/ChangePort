apiVersion: v1
kind: Namespace
metadata:
  name: changeport
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: changeport-provisioner
  namespace: changeport
---
# What the controller needs to apply the customer template
# (internal/provisioning/templates) and delete what it created. It is the
# privileged half of provisioning: the console only creates and deletes
# Customers.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: changeport-provisioner
rules:
  - apiGroups: [changeport.io]
    resources: [customers]
    verbs: [get, list, watch, patch, update]
  - apiGroups: [changeport.io]
    resources: [customers/status]
    verbs: [get, patch, update]
  - apiGroups: [changeport.io]
    resources: [customers/finalizers]
    verbs: [update]
  # The Postgres CDC sources in customers' namespaces (docs/cdc.md), which
  # deprovisioning deletes before the namespace.
  - apiGroups: [changeport.io]
    resources: [postgressources]
    verbs: [get, list, watch, patch, update, delete]
  # Customers' alert settings, which set their alerts' thresholds and where
  # the alerts go (docs/alerts.md).
  - apiGroups: [changeport.io]
    resources: [alertsettings]
    verbs: [get, list, watch]
  - apiGroups: [changeport.io]
    resources: [postgressources/status]
    verbs: [get, patch, update]
  - apiGroups: [changeport.io]
    resources: [postgressources/finalizers]
    verbs: [update]
  # Server-side apply creates and changes objects with patch, and needs
  # create for objects that do not exist yet.
  - apiGroups: [""]
    resources: [namespaces]
    verbs: [get, create, patch, delete]
  # The source controller moves each Postgres source's password from the
  # console's write-once Secret into the Connect worker's, and deletes the
  # console's. The alert routing controller reads customers' receiver
  # Secrets, deletes those no longer named, and writes Alertmanager's
  # configuration.
  - apiGroups: [""]
    resources: [secrets]
    verbs: [get, list, create, patch, update, delete]
  # Before deleting a customer's namespace, the controller marks the volumes
  # of its claims with when the customer was deprovisioned, for the purge
  # after 30 days (docs/runbook.md).
  - apiGroups: [""]
    resources: [persistentvolumeclaims]
    verbs: [list]
  - apiGroups: [""]
    resources: [persistentvolumes]
    verbs: [get, patch]
  # The console's Role reads the brokers' pods, which the provisioner must
  # hold to grant; it watches them itself for the timeline's broker
  # restarts (docs/timeline.md), with the Events Strimzi records when it
  # restarts one.
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
  - apiGroups: [""]
    resources: [events]
    verbs: [get, list, watch]
  # The CDC runtime (Deployments, Services, NetworkPolicies, KafkaUsers
  # and the KafkaConnect labelled changeport.io/part) is deleted again once
  # the template no longer renders it.
  - apiGroups: [apps]
    resources: [deployments]
    verbs: [get, create, patch, list, delete]
  - apiGroups: [""]
    resources: [services]
    verbs: [get, create, patch, list, delete]
  - apiGroups: [networking.k8s.io]
    resources: [networkpolicies]
    verbs: [get, create, patch, list, delete]
  # The Kafka Connect worker's metrics configuration, and Alertmanager's base
  # configuration, which the alert routing controller watches.
  - apiGroups: [""]
    resources: [configmaps]
    verbs: [get, create, patch, list, watch, delete]
  # The console's access to the Secrets it needs in each customer namespace.
  # Granting it needs no more than the controller holds itself.
  - apiGroups: [rbac.authorization.k8s.io]
    resources: [roles, rolebindings]
    verbs: [get, create, patch]
  - apiGroups: [cert-manager.io]
    resources: [certificates]
    verbs: [get, create, patch]
  - apiGroups: [kafka.strimzi.io]
    resources: [kafkas, kafkanodepools]
    verbs: [get, create, patch]
  - apiGroups: [kafka.strimzi.io]
    resources: [kafkausers, kafkaconnects, kafkaconnectors, kafkatopics]
    verbs: [get, create, patch, list, watch, delete]
  # Each customer's dedicated nodes on EKS Auto Mode.
  - apiGroups: [karpenter.sh]
    resources: [nodepools]
    verbs: [get, create, patch, delete]
  - apiGroups: [karpenter.sh]
    resources: [nodeclaims]
    verbs: [list]
  - apiGroups: [eks.amazonaws.com]
    resources: [nodeclasses]
    verbs: [get, create, patch, delete]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: changeport-provisioner
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: changeport-provisioner
subjects:
  - kind: ServiceAccount
    name: changeport-provisioner
    namespace: changeport
---
# The addresses of the Kubernetes API server, which customers' Kafka Connect
# workers may reach through their NetworkPolicy: Strimzi's config provider
# reads the workers' certificates from it.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: changeport-provisioner-kubernetes-api
  namespace: default
rules:
  - apiGroups: [discovery.k8s.io]
    resources: [endpointslices]
    verbs: [list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: changeport-provisioner-kubernetes-api
  namespace: default
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: changeport-provisioner-kubernetes-api
subjects:
  - kind: ServiceAccount
    name: changeport-provisioner
    namespace: changeport
---
# Leader election, so that a rollout never runs two controllers at once.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: changeport-provisioner-leader-election
  namespace: changeport
rules:
  - apiGroups: [coordination.k8s.io]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch, delete]
  - apiGroups: [""]
    resources: [events]
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: changeport-provisioner-leader-election
  namespace: changeport
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: changeport-provisioner-leader-election
subjects:
  - kind: ServiceAccount
    name: changeport-provisioner
    namespace: changeport
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: changeport-provisioner
  namespace: changeport
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: changeport-provisioner
  template:
    metadata:
      labels:
        app.kubernetes.io/name: changeport-provisioner
    spec:
      serviceAccountName: changeport-provisioner
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: provisioner
          image: changeport/provisioner:local
          args:
            - controller
            - -leader-elect
          ports:
            - name: metrics
              containerPort: 8080
            - name: probes
              containerPort: 8081
            # Where Alertmanager sends the timeline's alerts.
            - name: events
              containerPort: 8082
          livenessProbe:
            httpGet:
              path: /healthz
              port: probes
          readinessProbe:
            httpGet:
              path: /readyz
              port: probes
            periodSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              memory: 256Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
---
# Alertmanager sends the timeline's alerts, such as a client the brokers
# throttle, to the provisioner, which records them (docs/timeline.md).
apiVersion: v1
kind: Service
metadata:
  name: changeport-provisioner
  namespace: changeport
spec:
  selector:
    app.kubernetes.io/name: changeport-provisioner
  ports:
    - name: events
      port: 8082
      targetPort: events
---
# Only Alertmanager may send the provisioner alerts; its metrics and probes
# stay open, as before.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: changeport-provisioner
  namespace: changeport
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/name: changeport-provisioner
  policyTypes: [Ingress]
  ingress:
    - ports:
        - {protocol: TCP, port: 8080}
        - {protocol: TCP, port: 8081}
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: metrics
          podSelector:
            matchLabels:
              app.kubernetes.io/name: alertmanager
      ports:
        - {protocol: TCP, port: 8082}
